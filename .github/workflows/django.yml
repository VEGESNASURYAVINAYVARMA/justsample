name: Django CI

on:
  push:
    branches: [ "feature/*", "test", "main" ]
  pull_request:
    branches: [ "test", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.9, 3.10]   # ✅ ONLY these versions

    env:
      DJANGO_SETTINGS_MODULE: expense_project.settings

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      run: |
        cd expense_project
        python manage.py migrate

    - name: Run tests
      run: |
        cd expense_project
        python manage.py test